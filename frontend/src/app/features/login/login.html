<div class="flex min-h-dvh flex-col bg-subtle">
  <header class="flex h-16 items-center px-6">
    <span class="flex items-center gap-2">
      <span class="grid size-7 place-items-center rounded-md bg-primary text-white">
        <svg viewBox="590 314 380 380" class="size-4" fill="currentColor" aria-hidden="true"><path d="M610,337 H835 A114,114 0 0 1 835,565 H697 Q687,565 687,575 V612 L620,665 Q610,672 610,662 V552 L670,500 Q678,495 686,495 H835 A45,45 0 0 0 835,405 H687 Q675,405 675,415 V440 L618,494 Q610,500 610,490 Z"/></svg>
      </span>
      <span class="text-[15px] font-semibold tracking-tight">Patio</span>
    </span>
  </header>

  <main class="flex flex-1 items-center justify-center px-4 pb-16">
    <div class="page-enter w-full max-w-[400px]">
      <div class="mb-8 text-center">
        <h1 class="text-[32px] leading-tight font-semibold tracking-[-0.04em]">{{ t('login.title') }}</h1>
        <p class="mt-2 text-[15px] text-muted">{{ t('login.subtitle') }}</p>
      </div>

      <form class="panel space-y-5 p-6 sm:p-8" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (error()) {
          <p class="alert-error" role="alert">{{ error() }}</p>
        }

        <div>
          <label class="field-label" for="email">{{ t('login.email') }}</label>
          <input
            id="email"
            class="field"
            type="email"
            autocomplete="username"
            inputmode="email"
            placeholder="you@company.com"
            formControlName="email"
            autofocus
            [attr.aria-invalid]="invalid('email')"
            [attr.aria-describedby]="invalid('email') ? 'email-error' : null"
          />
          @if (invalid('email')) {
            <p id="email-error" class="field-error">{{ t('login.emailInvalid') }}</p>
          }
        </div>

        <div>
          <label class="field-label" for="password">{{ t('login.password') }}</label>
          <div class="relative">
            <input
              id="password"
              class="field pr-10"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              formControlName="password"
              [attr.aria-invalid]="invalid('password')"
              [attr.aria-describedby]="invalid('password') ? 'password-error' : null"
            />
            <button
              type="button"
              class="absolute inset-y-0 right-0 grid w-10 cursor-pointer place-items-center rounded-md text-muted hover:text-foreground"
              [attr.aria-label]="showPassword() ? t('login.hidePassword') : t('login.showPassword')"
              [attr.aria-pressed]="showPassword()"
              (click)="showPassword.set(!showPassword())"
            >
              <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" size="16" />
            </button>
          </div>
          @if (invalid('password')) {
            <p id="password-error" class="field-error">{{ t('login.passwordRequired') }}</p>
          }
        </div>

        <button type="submit" class="btn btn-primary h-10 w-full" [disabled]="loading()">
          @if (loading()) {
            {{ t('login.signingIn') }}
          } @else {
            {{ t('login.continue') }} <ng-icon name="lucideArrowRight" size="16" aria-hidden="true" />
          }
        </button>
      </form>

      <p class="mt-6 text-center text-[13px] text-muted">{{ t('login.forgot') }}</p>
    </div>
  </main>
</div>
