# Production profile: start with SPRING_PROFILES_ACTIVE=prod.
# Placeholders without a default must be provided by the environment, so the
# application fails at startup instead of running with development secrets.
app:
  demo-data: false
  jwt:
    secret: ${JWT_SECRET}
  bootstrap-admin:
    password: ${ADMIN_PASSWORD}

server:
  forward-headers-strategy: framework

  port: ${PORT:8080}
