spring:
  application:
    name: patio-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/estacionamento?useTimezone=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
    username: ${DB_USER:parking}
    password: ${DB_PASSWORD:parking123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  demo-data: ${DEMO_DATA:true}
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
