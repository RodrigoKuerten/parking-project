spring:
  application:
    name: patio-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/estacionamento?useTimezone=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
    username: ${DB_USER:parking}
    password: ${DB_PASSWORD:parking123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  demo-data: ${DEMO_DATA:true}
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET:patio-local-development-secret-change-in-production-2026}
    issuer: ${JWT_ISSUER:patio-api}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  bootstrap-admin:
    name: ${ADMIN_NAME:Patio Admin}
    email: ${ADMIN_EMAIL:admin@patio.local}
    password: ${ADMIN_PASSWORD:Admin@123}
